name = "easypost-license-webhook"
main = "src/worker.js"
compatibility_date = "2025-06-01"
# node:crypto (Ed25519 signing + HMAC) requires nodejs_compat.
compatibility_flags = ["nodejs_compat"]

# Logs, because this Worker is the money path and it failed silently once.
#
# A first paid order never produced a licence. All Paddle could show was the
# delivery log: four "401 invalid signature", two "404 Not found", then a bare
# "500 error code: 1101" — Cloudflare's way of saying the Worker threw, with no
# hint as to where. Diagnosing it meant reading the source and reasoning about
# which call could raise, because there was nothing else to look at.
#
# Sampling is 1.0 deliberately. This Worker handles a handful of requests a day
# and each one is a purchase, an activation or a support message; there is no
# volume argument for throwing any of them away.
[observability]
enabled = true
head_sampling_rate = 1

# The seat ledger: which computers each licence is on, plus revocations.
[[d1_databases]]
binding = "LICENSES"
database_name = "easypost-licenses"
database_id = "2deb96f3-3585-4c03-a147-11547e5f76c1"

# Non-secret configuration. Set the real values here before deploying.
[vars]
# Which tier each Paddle price buys. A price that is not listed mints nothing,
# so a new product cannot hand out licences before its tier has been decided.
PRICE_TIERS = '{"pri_01ky2hekjfm1c9nspf5pnqv0jv":"personal","pri_01ky3fxcf519vwq9vw8cwy35k9":"business","pri_01ky3fxdv0gcg0xnf04npzpb2k":"organisation"}'
# Legacy single-price setting, read as the entry tier when PRICE_TIERS omits it.
PADDLE_PRICE_ID = "pri_01ky2hekjfm1c9nspf5pnqv0jv"
LICENSE_FROM_EMAIL = "licenses@easy-post.spencerfields.com"
CONTACT_TO_EMAIL = "Apps@spencerfields.com"
# Wren runs on its OWN Resend account, so its support mail needs its own key
# (secret RESEND_API_KEY_WREN) and its own verified sender.
#
# Live since 2026-08-18: Resend reports wren.spencerfields.com verified (DKIM,
# SPF MX and SPF TXT all green) on domain fd42c8cc-5111-48e5-a7f1-a09505e0c685.
#
# To roll back, comment this line out and redeploy: resolveSender() requires
# BOTH the key and the address, so Wren mail falls straight back to the
# Easy-Post account under a "Wren Support" display name with nothing else
# changing.
WREN_FROM_EMAIL = "support@wren.spencerfields.com"
# The business site has its own Resend account and verified domain, so its mail
# goes out under its own name rather than borrowing the Easy-Post sender.
SOFTWARE_FROM_EMAIL = "support@software.spencerfields.com"
# PADDLE_API_BASE = "https://api.paddle.com"      # sandbox: https://sandbox-api.paddle.com
# LICENSE_PRODUCT_ID = "easypost-desktop"

# Secrets are NOT stored here — set them with `wrangler secret put`:
#   LICENSE_PRIVATE_KEY_PEM  PADDLE_WEBHOOK_SECRET  PADDLE_API_KEY
#   RESEND_API_KEY  CONTACT_SHARED_SECRET
#   ANTHROPIC_API_KEY   ← contact-form AI triage. If unset, the form still
#                         works: it just acknowledges and routes to a human
#                         instead of drafting an auto-reply.
#   STATS_SECRET        ← guards GET /stats (platform/tier demand counts). If
#                         unset, /stats returns 403 to everyone (fails closed).
